<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenUI 中文站 — 生成式 UI 的开放标准</title>
    <meta
      name="description"
      content="OpenUI 是一个全栈、渲染器无关的生成式 UI 框架，围绕紧凑、流式优先的 OpenUI Lang 构建。比等价 JSON 最多减少 67% 的 token。"
    />
    <link rel="canonical" href="https://openui.ndjp.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenUI 中文站" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="OpenUI 中文站 — 生成式 UI 的开放标准" />
    <meta
      property="og:description"
      content="OpenUI 是一个全栈、渲染器无关的生成式 UI 框架，围绕紧凑、流式优先的 OpenUI Lang 构建，比等价 JSON 最多减少 67% 的 token。"
    />
    <meta property="og:url" content="https://openui.ndjp.net/" />
    <meta property="og:image" content="https://openui.ndjp.net/og.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenUI 中文站 — 生成式 UI 的开放标准" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://openui.ndjp.net/og.svg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)" />
    <script>
      // 在首帧前确定主题，避免闪白/闪黑
      (function () {
        try {
          var saved = localStorage.getItem("openui-cn-theme");
          var mode =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
